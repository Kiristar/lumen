<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<title>Lumen 流光歌詞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* ───────────── Tokens ───────────── */
:root{
  --bg:#eee8df; --ink-rgb:22,18,28; --muted:rgba(22,18,28,.62); --faint:rgba(22,18,28,.1);
  --panel:rgba(255,255,255,.74); --panel-line:rgba(22,18,28,.08); --accent:#5a3fd0;
  --vignette:rgba(255,255,255,.3); --un:.3; --glow:0; --scrim:rgba(30,20,40,.25);
  --art-shadow:0 28px 60px -26px rgba(40,24,64,.5);
  --spotify:#1ed760; --spotify-ink:#03140a; --danger:#e5484d;
  --ui:"Plus Jakarta Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08070c; --ink-rgb:255,255,255; --muted:rgba(255,255,255,.64); --faint:rgba(255,255,255,.12);
    --panel:rgba(14,12,22,.74); --panel-line:rgba(255,255,255,.09); --accent:#a9d4ff;
    --vignette:rgba(0,0,0,.55); --un:.4; --glow:1; --scrim:rgba(0,0,0,.45);
    --art-shadow:0 34px 80px -22px rgba(0,0,0,.75); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08070c; --ink-rgb:255,255,255; --muted:rgba(255,255,255,.64); --faint:rgba(255,255,255,.12);
  --panel:rgba(14,12,22,.74); --panel-line:rgba(255,255,255,.09); --accent:#a9d4ff;
  --vignette:rgba(0,0,0,.55); --un:.4; --glow:1; --scrim:rgba(0,0,0,.45);
  --art-shadow:0 34px 80px -22px rgba(0,0,0,.75); color-scheme:dark;
}

/* ───────────── Base ───────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:rgb(var(--ink-rgb));font-family:var(--ui);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
[hidden]{display:none!important}

#aurora{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 110% at 62% 42%,transparent 38%,var(--vignette) 100%)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.eco .grain{display:none}

#app{position:fixed;inset:0;z-index:2}
.view{position:absolute;inset:0;display:none}
#app[data-view="setup"] #setup,#app[data-view="phone"] #phone,#app[data-view="player"] #player{display:grid}
#app[data-view="boot"]::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;
  border:3px solid var(--faint);border-top-color:rgb(var(--ink-rgb));animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--panel);border:1px solid var(--panel-line);border-radius:30px;box-shadow:0 40px 100px -40px rgba(0,0,0,.45)}
.hq .card{-webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:999px;
  font-weight:700;font-size:17px;background:var(--faint);transition:transform .2s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55}
.btn.primary{background:rgb(var(--ink-rgb));color:var(--bg)}
.btn.spotify{background:var(--spotify);color:var(--spotify-ink)}
.btn.quiet{background:transparent;color:var(--muted)}
.btn.wide{width:100%}
.muted{color:var(--muted)}

/* ───────────── Setup (car) ───────────── */
#setup{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;gap:clamp(28px,5vw,96px);padding:clamp(28px,5.5vw,104px)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:13px;letter-spacing:.38em;text-transform:uppercase;color:var(--muted)}
.mark{width:26px;height:26px;border-radius:8px;flex:none;background:conic-gradient(from 200deg,#ff9a62,#ff4f7e,#9a63ff,#3cc8ff,#ff9a62);box-shadow:0 0 28px rgba(154,99,255,.55)}
.hero-title{margin:.26em 0 .2em;font-size:clamp(56px,8vw,136px);font-weight:900;letter-spacing:-.035em;line-height:1;
  background:linear-gradient(100deg,rgb(var(--ink-rgb)) 0%,rgb(var(--ink-rgb)) 38%,var(--accent) 50%,rgb(var(--ink-rgb)) 62%,rgb(var(--ink-rgb)) 100%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,15%{background-position:100% 0}60%,100%{background-position:0 0}}
.hero-ly{margin:0 0 .9em;font-size:clamp(22px,2.5vw,40px);font-weight:800;letter-spacing:-.01em;line-height:1.3;
  background:linear-gradient(90deg,rgb(var(--ink-rgb)) 0 46%,rgba(var(--ink-rgb),.26) 54% 100%);background-size:240% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:fillhero 5.5s cubic-bezier(.45,0,.35,1) infinite}
@keyframes fillhero{0%{background-position:100% 0}72%,100%{background-position:0 0}}
.lede{max-width:30em;margin:0;font-size:clamp(16px,1.45vw,22px);line-height:1.65;color:var(--muted);font-weight:500}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(24px,3.4vw,48px)}
.pair{justify-self:center;width:min(100%,430px);padding:clamp(22px,2.4vw,34px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;position:relative}
.qr{position:relative;width:min(280px,36vh);aspect-ratio:1;border-radius:22px;background:#fff;padding:16px;transition:filter .5s,transform .5s}
.qr svg{display:block;width:100%;height:100%}
.qr .scan{position:absolute;inset:10px;border-radius:14px;overflow:hidden;pointer-events:none}
.qr .scan::after{content:"";position:absolute;left:0;right:0;height:34%;top:-34%;background:linear-gradient(180deg,transparent,rgba(120,90,255,.13),transparent);animation:scan 3.4s ease-in-out infinite}
@keyframes scan{to{top:100%}}
.qr-fallback{display:grid;place-items:center;height:100%;color:#333;font-size:13px;line-height:1.5;text-align:center;word-break:break-all}
.pair h2{margin:2px 0 0;font-size:clamp(20px,1.8vw,26px);font-weight:800;letter-spacing:-.01em}
.pair p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.status{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--muted);padding:9px 15px;border-radius:99px;background:var(--faint)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ping 1.8s ease-out infinite}
.status.ok{color:rgb(var(--ink-rgb))} .status.ok i{background:var(--spotify);animation:none}
.status.err i{background:var(--danger);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(var(--ink-rgb),.45)}100%{box-shadow:0 0 0 12px rgba(var(--ink-rgb),0)}}
.pair.linked .qr{filter:blur(6px) saturate(.4);transform:scale(.94)}
.linked-badge{position:absolute;left:50%;top:clamp(22px,2.4vw,34px);width:min(280px,36vh);aspect-ratio:1;transform:translateX(-50%);display:grid;place-items:center;pointer-events:none}
.linked-badge svg{width:46%;height:46%}
.linked-badge circle{fill:var(--spotify)}
.linked-badge path{fill:none;stroke:#062012;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .25s ease forwards}
.linked-badge svg{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* ───────────── Phone pairing ───────────── */
#phone{place-items:center;padding:20px;overflow:auto}
.pcard{width:min(100%,440px);padding:30px 24px 26px;text-align:center}
.pcard h2{margin:18px 0 8px;font-size:25px;font-weight:800;letter-spacing:-.01em}
.pc-sub{margin:0 0 6px;color:var(--muted);line-height:1.6;font-size:15px}
.pcard .btn{margin-top:18px}
.fine{margin:16px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.link-art{width:180px;height:72px;margin:0 auto;display:block}
.link-art rect{fill:none;stroke:rgb(var(--ink-rgb));stroke-width:2.4;opacity:.8}
.link-art .d{fill:var(--accent);animation:hop 1.6s ease-in-out infinite}
.link-art .d:nth-of-type(2){animation-delay:.2s}.link-art .d:nth-of-type(3){animation-delay:.4s}
@keyframes hop{0%,100%{opacity:.2}50%{opacity:1}}
.done-art{width:96px;height:96px;margin:0 auto;display:block}
.done-art circle{fill:var(--spotify)} .done-art path{fill:none;stroke:#062012;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .7s .2s ease forwards}
.done-art{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.field{display:block;margin-top:18px;text-align:left}
.field span{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:8px}
.field input{width:100%;min-height:54px;padding:0 16px;border-radius:14px;border:1.5px solid var(--panel-line);background:var(--faint);font-size:16px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.02em;outline:none}
.field input:focus{border-color:var(--accent)}
.field.bad input{border-color:var(--danger)}
details.help{margin-top:16px;text-align:left;border-radius:16px;background:var(--faint);padding:2px 16px}
details.help summary{cursor:pointer;padding:13px 0;font-weight:700;font-size:15px;list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:"＋";float:right;color:var(--muted)}
details.help[open] summary::after{content:"－"}
.spin{width:40px;height:40px;margin:26px auto 4px;border-radius:50%;border:3px solid var(--faint);border-top-color:var(--accent);animation:spin 1s linear infinite}

/* ───────────── Steps / copy (sheet + phone) ───────────── */
.steps{counter-reset:s;list-style:none;padding:0;margin:16px 0 4px}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 44px;line-height:1.6;font-size:14.5px;color:var(--muted)}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--faint);color:rgb(var(--ink-rgb));font-weight:800;font-size:14px}
.steps b{display:block;color:rgb(var(--ink-rgb));font-size:15.5px;margin-bottom:2px}
.steps code{font-size:13px;color:rgb(var(--ink-rgb))}
.copyrow{display:flex;gap:8px;align-items:center;margin-top:8px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--faint)}
.copyrow code{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere;color:rgb(var(--ink-rgb))}
.copyrow button{flex:none;padding:9px 13px;border-radius:9px;background:rgb(var(--ink-rgb));color:var(--bg);font-weight:700;font-size:13px}
.note{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--faint);font-size:14px;line-height:1.6;color:rgb(var(--ink-rgb))}

/* ───────────── Player ───────────── */
#app{--fs:clamp(26px,min(4vw,6.6vh),68px)}
#app[data-size="s"]{--fs:clamp(22px,min(3.2vw,5.4vh),54px)}
#app[data-size="l"]{--fs:clamp(30px,min(4.8vw,8vh),84px)}
#app[data-size="xl"]{--fs:clamp(34px,min(5.8vw,9.6vh),100px)}
#player{grid-template-columns:minmax(240px,30%) minmax(0,1fr);gap:clamp(28px,4.4vw,84px);padding:clamp(20px,3.6vw,64px) clamp(24px,4vw,72px)}
.np{align-self:center;display:flex;flex-direction:column;gap:clamp(16px,2.4vh,28px);min-width:0;transition:opacity .6s}
.art{position:relative;width:min(100%,50vh);aspect-ratio:1;flex:none}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:clamp(12px,1.2vw,20px);box-shadow:var(--art-shadow);
  transition:opacity .5s ease,transform .9s cubic-bezier(.2,.9,.25,1);background:var(--faint)}
.art img.out{opacity:0;transform:scale(.94)}
.paused .art img{transform:scale(.93)}
.halo{position:absolute;inset:10% 6% -7%;border-radius:30%;background-size:cover;background-position:center;filter:blur(44px) saturate(1.6);opacity:.55;z-index:-1}
.eco .halo{display:none}
.meta{min-width:0}
.np-title{font-size:clamp(19px,1.9vw,32px);font-weight:800;letter-spacing:-.01em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.np-artist{margin-top:6px;font-size:clamp(14px,1.25vw,21px);font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap .np-title,.swap .np-artist{animation:rise .7s cubic-bezier(.2,.9,.25,1) both}
.swap .np-artist{animation-delay:.06s}
.bar{margin-top:clamp(14px,2.2vh,24px);height:5px;border-radius:9px;background:var(--faint);overflow:hidden}
.bar i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(0);background:rgb(var(--ink-rgb));opacity:.92;border-radius:inherit}
.times{display:flex;justify-content:space-between;margin-top:9px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.src{margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);opacity:.75;display:flex;align-items:center;gap:8px}
.src .off{display:none;color:var(--danger)}
.net-off .src .off{display:inline}
.paused-chip{display:none;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.paused .paused-chip{display:inline-flex}

.ly{position:relative;min-width:0;min-height:0}
.ly-view{position:absolute;top:0;right:0;bottom:0;left:-28px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 13%,#000 72%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 13%,#000 72%,transparent 100%)}
.ly-track{position:relative;padding:0 2% 0 28px}
.enter{animation:rise .8s cubic-bezier(.2,.9,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}

.item{font-size:var(--fs);margin:0 0 .46em;transform-origin:0 50%;
  transform:translate3d(0,var(--y,0px),0) scale(var(--s,.94));opacity:var(--o,.13);filter:blur(var(--b,0px));
  transition:transform .85s cubic-bezier(.2,.85,.25,1),opacity .55s ease,filter .55s ease}
.eco .item{filter:none}
.instant .item{transition:none!important}
.item[data-d="0"]{--o:1;--b:0px;--s:1}
.item[data-d="1"]{--o:.5;--b:0px;--s:.96}
.item[data-d="2"]{--o:.34;--b:.7px;--s:.955}
.item[data-d="3"]{--o:.24;--b:1.4px;--s:.95}
.item[data-d="4"]{--o:.18;--b:2.2px;--s:.945}
.item[data-d="5"]{--o:.13;--b:3px;--s:.94}
.item[data-d="-1"]{--o:.36;--b:.4px;--s:.96}
.item[data-d="-2"]{--o:.24;--b:1.1px;--s:.955}
.item[data-d="-3"]{--o:.17;--b:1.8px;--s:.95}
.item[data-d="-4"]{--o:.12;--b:2.6px;--s:.945}
.item[data-d="-5"]{--o:.08;--b:3px;--s:.94}
.line{font-weight:800;line-height:1.24;letter-spacing:-.012em;cursor:pointer;overflow-wrap:anywhere}
.line .main{display:block}
.u{display:inline-block;white-space:pre}
.line.active .u{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(90deg,rgb(var(--ink-rgb)) 0,rgb(var(--ink-rgb)) calc(var(--p,0)*125% - 25%),rgba(var(--ink-rgb),var(--un)) calc(var(--p,0)*125%),rgba(var(--ink-rgb),var(--un)) 100%);
  transform:translateY(calc(var(--p,0)*-.045em))}
.hq .line.active .u.glow{filter:drop-shadow(0 0 calc(var(--g,0)*.3em) rgba(var(--ink-rgb),calc(var(--g,0)*var(--glow)*.6)))}
.line .sub{display:block;margin-top:.24em;font-size:.5em;font-weight:600;letter-spacing:0;line-height:1.32;opacity:.72}
.no-trans .line .sub{display:none}
.line.credit{font-size:calc(var(--fs)*.42);font-weight:700;letter-spacing:.05em;cursor:default}
.line.credit .u{background:none!important;color:rgb(var(--ink-rgb))!important;transform:none!important}
.line.plain{cursor:default;opacity:.82;font-size:calc(var(--fs)*.8);transform:none;filter:none}
.line.blank{height:.5em}
.line.tap{animation:tap .45s ease}
@keyframes tap{40%{opacity:1}}
.gap{height:1.15em;display:flex;align-items:center}
.gap .dots{display:flex;gap:.3em;align-items:center;padding-left:.04em;transform-origin:0 50%}
#app[data-layout="immersive"] .gap .dots{transform-origin:50% 50%}
.gap i{width:.3em;height:.3em;border-radius:50%;background:rgb(var(--ink-rgb));opacity:calc(.25 + var(--p,0)*.75);transform:scale(calc(.72 + var(--p,0)*.4));transition:transform .4s,opacity .4s}
.gap.active .dots{animation:breathe 2.4s ease-in-out infinite}
.gap.ending i{transform:scale(0)!important;opacity:0!important}
@keyframes breathe{50%{transform:scale(1.14)}}

.ly-state{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding-bottom:6vh}
.st-title{font-size:calc(var(--fs)*1.1);font-weight:900;letter-spacing:-.025em;line-height:1.08;overflow-wrap:anywhere}
.st-artist{font-size:calc(var(--fs)*.46);color:var(--muted);font-weight:700;margin-top:.35em}
.st-note{margin-top:1.8em;font-size:clamp(15px,1.35vw,21px);font-weight:700;color:var(--muted);display:flex;gap:12px;align-items:center}
.ly-state.tappable{cursor:pointer}
.shimmer{background:linear-gradient(90deg,var(--muted) 0 40%,rgb(var(--ink-rgb)) 50%,var(--muted) 60% 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.2s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
.eq{display:inline-flex;gap:4px;align-items:flex-end;height:20px}
.eq i{width:4px;height:100%;border-radius:2px;background:var(--accent);transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}.eq i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}

.idle{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
#app[data-ly="idle"] .idle{display:flex}
#app[data-ly="idle"] .np,#app[data-ly="idle"] .ly{opacity:0;pointer-events:none}
.clock{font-size:clamp(88px,15vw,240px);font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.date{font-size:clamp(18px,1.8vw,28px);font-weight:700;color:var(--muted)}
.idle-note{margin-top:30px;color:var(--muted);font-size:clamp(15px,1.3vw,19px);font-weight:600;display:flex;align-items:center;gap:10px}

/* Immersive layout */
#app[data-layout="immersive"]{--fs-mul:1.1}
#app[data-layout="immersive"] #player{grid-template-columns:minmax(0,1fr);padding-bottom:calc(clamp(20px,3.6vw,64px) + 76px)}
#app[data-layout="immersive"] .np{position:absolute;left:clamp(20px,3vw,48px);bottom:clamp(16px,3vh,32px);flex-direction:row;align-items:center;gap:16px;width:min(560px,calc(100% - 40px))}
#app[data-layout="immersive"] .art{width:64px}
#app[data-layout="immersive"] .halo,#app[data-layout="immersive"] .times,#app[data-layout="immersive"] .src{display:none}
#app[data-layout="immersive"] .meta{flex:1}

const LV = {
  view: $('#lyView'), track: $('#lines'), stateBox: $('#lyState'),
  items: [], active: -1, tops: [], heights: [], anchor: 0, mode: 'idle', plainY: null,

  enter() { const ly = $('#ly'); ly.classList.remove('enter'); void ly.offsetWidth; ly.classList.add('enter'); },
  clear() { this.items = []; this.active = -1; this.track.replaceChildren(); this.track.style.transform = ''; this.plainY = null; },

  set(model) {
    this.clear(); this.mode = 'synced';
    const frag = document.createDocumentFragment();
    model.items.forEach((it, idx) => {
      let node;
      if (it.kind === 'gap') { node = el('div', 'item gap'); const d = el('span', 'dots'); d.append(el('i'), el('i'), el('i')); node.append(d); it.dots = [...d.children]; }

  setPlain(text) {

  state(kind, sig) {

    const eq = () => { const e = el('span', 'eq'); for (let i = 0; i < 4; i++) e.append(el('i')); return e; };
    if (kind === 'loading') note.append(eq(), el('span', 'shimmer', '正在尋找歌詞'));

    }

  },

  show(kind) {
    app.dataset.ly = kind;
    const lyr = kind === 'synced' || kind === 'plain';
    this.view.hidden = !lyr; this.stateBox.hidden = lyr || kind === 'idle';
    $('#srcLabel').textContent = kind === 'synced' ? 'LRCLIB · 同步歌詞' : kind === 'plain' ? 'LRCLIB · 未同步歌詞' : '';
  },

  relayout(instant) {
    if (this.mode !== 'synced' && this.mode !== 'plain') return;
    const vh = this.view.clientHeight; if (!vh) return;
    this.anchor = vh * (prefs.layout === 'immersive' ? .4 : .36);
    if (this.mode === 'plain') { this.plainY = null; return; }
    this.tops = this.items.map(it => it.el.offsetTop);
    this.heights = this.items.map(it => it.el.offsetHeight);
    this.place(instant ? 'instant' : 'none');
  },

  place(kind) {

    const a = Math.max(this.active, 0);
    const y = this.anchor - (this.tops[a] + this.heights[a] / 2);
    for (let i = 0; i < n; i++) {
      const it = this.items[i], st = it.el.style;

    }
    if (kind === 'instant') { this.track.classList.add('instant'); void this.track.offsetHeight; requestAnimationFrame(() => this.track.classList.remove('instant')); }
  },

  findIndex(t) {

    while (lo <= hi) { const mid = (lo + hi) >> 1; if (a[mid].t <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
    return ans;
  },

  setActive(i) {

      const p = this.items[prev]; p.el.classList.remove('active', 'ending');
      if (p.unitEls) p.units.forEach((u, k) => { u._p = u._g = undefined; const s = p.unitEls[k]; s.style.removeProperty('--p'); s.style.removeProperty('--g'); s.classList.remove('glow'); });
      if (p.dots) p.dots.forEach(d => d.style.removeProperty('--p'));

    if (i >= 0) this.items[i].el.classList.add('active');

  },

  update(t) {
    if (this.mode === 'plain') return this.updatePlain(t);

    const i = this.findIndex(t);
    if (i !== this.active) this.setActive(i);
    if (i < 0) return;
    const it = this.items[i];
    if (it.kind === 'gap') {
      const p = clamp((t - it.t) / (it.end - it.t), 0, 1);
      it.dots.forEach((d, k) => d.style.setProperty('--p', clamp(p * 3 - k, 0, 1).toFixed(3)));
      it.el.classList.toggle('ending', it.end - t < 420);
      return;
    }
    if (it.credit) return;
    const us = it.units, els = it.unitEls;
    for (let k = 0; k < us.length; k++) {
      const u = us[k];
      const p = t <= u.t0 ? 0 : t >= u.t1 ? 1 : (t - u.t0) / (u.t1 - u.t0);
      const g = p > 0 && p < 1 ? 1 : p === 1 ? Math.max(0, 1 - (t - u.t1) / 600) : 0;
      if (u._p === undefined || Math.abs(p - u._p) > .004 || (p !== u._p && (p === 0 || p === 1))) { els[k].style.setProperty('--p', p.toFixed(3)); u._p = p; }
      if (u._g !== g && (u._g === undefined || Math.abs(g - u._g) > .02 || g === 0)) {
        els[k].style.setProperty('--g', g.toFixed(2)); els[k].classList.toggle('glow', g > 0); u._g = g;
      }
    }
  },

  updatePlain(t) {
    const dur = pb.duration || 1, frac = clamp((t - 6000) / Math.max(1, dur - 16000), 0, 1);
    const total = this.track.scrollHeight, vh = this.view.clientHeight;
    const target = this.anchor * .5 - frac * Math.max(0, total - vh * .55);
    this.plainY = this.plainY == null ? target : this.plainY + (target - this.plainY) * .06;
    this.track.style.transform = `translate3d(0,${this.plainY.toFixed(1)}px,0)`;
  },
};

/* ════════════════ 手機 QR 配對（ntfy 中繼 + AES-GCM 端對端加密） ════════════════ */
const pairing = {
  es: null, keyRaw: null, url: '', busy: false,
  async start() {
    this.stop();
    const status = (txt, cls) => { const s = $('#pairStatus'); s.className = 'status' + (cls ? ' ' + cls : ''); s.lastElementChild.textContent = txt; };
    this.status = status;
    $('#pairCard').classList.remove('linked'); $('.linked-badge')?.remove();
    if (!crypto.subtle) { status('需要 HTTPS 網址才能配對', 'err'); renderQR(null); return; }
    const id = b64u.enc(rand(12)); this.keyRaw = rand(32);
    this.url = REDIRECT_URI + '#p=' + id + '.' + b64u.enc(this.keyRaw);
    renderQR(this.url).then(() => { if (this.es && this.es.readyState !== 2) status('等待手機掃描…'); });
    const since = Math.floor(Date.now() / 1000) - 5;
    try {
      const es = new EventSource(`${NTFY}/lumen-${id}/sse?since=${since}`);
      this.es = es;
      es.onopen = () => status('等待手機掃描…');
      es.onerror = () => status('連線中…');
      es.onmessage = ev => this.onMsg(ev.data);
    } catch { status('無法建立配對連線', 'err'); }
  },
  async onMsg(data) {

    if (payload?.v !== 1) return;
    this.busy = true;
    try {
      const key = await crypto.subtle.importKey('raw', this.keyRaw, 'AES-GCM', false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u.dec(payload.iv) }, key, b64u.dec(payload.ct));
      const obj = JSON.parse(dec.decode(pt));
      this.stop();
      this.status('已收到，連接 Spotify…', 'ok');
      auth = { cid: obj.cid, rt: obj.rt, at: null, exp: 0 };
      await refreshToken();
      const card = $('#pairCard'); card.classList.add('linked');
      const b = el('div', 'linked-badge'); b.innerHTML = '<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="25"/><path d="M15 27l7 7 15-16"/></svg>'; card.append(b);
      this.status('連接成功', 'ok');
      setTimeout(enterPlayer, 1300);
    } catch (e) {
      this.busy = false;
      if (!auth) this.status('配對失敗，請重新掃描', 'err');
      else { auth = null; this.status('登入失敗：' + e.message, 'err'); }

    }

  },
  stop() { this.es?.close(); this.es = null; },
};
async function renderQR(text) {
  const box = $('#qr');
  box.querySelector('svg, .qr-fallback')?.remove();
  if (!text) { const f = el('div', 'qr-fallback', '請用 HTTPS 網址開啟'); box.prepend(f); return; }
  try {
    await loadScript(QR_LIBS, () => typeof window.qrcode === 'function');
    const qr = window.qrcode(0, 'M'); qr.addData(text); qr.make();
    const n = qr.getModuleCount();
    const inFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c) && !inFinder(r, c)) d += `M${c + .1} ${r + .1}h.8v.8h-.8z`;
    const finder = (x, y) => `<rect x="${x + .5}" y="${y + .5}" width="6" height="6" rx="1.8" fill="none" stroke="#120f1a" stroke-width="1"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx=".9" fill="#120f1a"/>`;
    const svg = `<svg viewBox="-.5 -.5 ${n + 1} ${n + 1}" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision"><path d="${d}" fill="#120f1a"/>${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
    box.insertAdjacentHTML('afterbegin', svg);
  } catch {
    const f = el('div', 'qr-fallback'); f.append('無法產生 QR Code', el('br'), el('small', null, text)); box.prepend(f);
  }
}
async function sendToCar(pair, cid, tokens) {
  phoneView('sending');
  const key = await crypto.subtle.importKey('raw', b64u.dec(pair.key), 'AES-GCM', false, ['encrypt']);
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify({ cid, rt: tokens.refresh_token })));
  const body = JSON.stringify({ v: 1, iv: b64u.enc(iv), ct: b64u.enc(ct) });
  const url = `${NTFY}/lumen-${pair.id}`;
  try { const r = await fetch(url, { method: 'POST', body }); if (!r.ok) throw new Error('ntfy ' + r.status); }
  catch (e) { if (e instanceof TypeError) await fetch(url, { method: 'POST', body, mode: 'no-cors' }); else throw e; }
  phoneView('done');
}

    f.append(el('span', null, 'Spotify Client ID'), inp);
    inp.value = clientId(); inp.placeholder = '貼上 32 碼 Client ID'; inp.autocomplete = 'off'; inp.spellcheck = false; inp.setAttribute('autocapitalize', 'off');
    if (DEFAULT_CLIENT_ID) f.hidden = true;
    const btn = el('button', 'btn spotify wide', '使用 Spotify 登入');
    btn.onclick = () => {
      const v = inp.value.trim();
      if (!/^[0-9a-f]{32}$/i.test(v)) { f.classList.add('bad'); inp.focus(); toast('Client ID 應該是 32 碼英數字'); return; }
      store.set('cid', v); btn.disabled = true; btn.textContent = '前往 Spotify…';
      startLogin('pair', v, opt.pair);
    };
    const help = el('details', 'help'); help.append(el('summary', null, '還沒有 Client ID？看設定步驟'), guideSteps());
    card.append(f, btn, help, el('p', 'fine', '配對金鑰只存在 QR Code 裡；傳到車上的資料全程加密，中繼伺服器看不到內容。'));
  } else if (kind === 'sending') {
    card.append(el('div', 'spin'), el('h2', null, '正在傳送到車上…'), el('p', 'pc-sub', '請稍候幾秒鐘'));
  } else if (kind === 'done') {
    const w = el('div'); w.innerHTML = '<svg class="done-art" viewBox="0 0 52 52"><circle cx="26" cy="26" r="25"/><path d="M15 27l7 7 15-16"/></svg>';
    card.append(w.firstChild, el('h2', null, '完成！'), el('p', 'pc-sub', '看看車上的螢幕，歌詞已經準備好了。這個頁面可以關閉。'));
  } else if (kind === 'error') {
    card.append(linkArt(), el('h2', null, '出了點問題'), el('p', 'pc-sub', opt.msg || '請再試一次'));
    if (opt.pair) { const b = el('button', 'btn primary wide', '重新登入'); b.onclick = () => phoneView('form', { pair: opt.pair }); card.append(b); }
    else card.append(el('p', 'fine', '請回到車上重新掃描 QR Code。'));
  }
}
const SETTINGS = [
  { k: 'layout', label: '版面', opts: [['classic', '經典'], ['immersive', '沉浸']] },
  { k: 'size', label: '歌詞大小', opts: [['s', '小'], ['m', '中'], ['l', '大'], ['xl', '特大']] },
  { k: 'theme', label: '主題', opts: [['dark', '深色'], ['light', '淺色'], ['auto', '跟隨系統']] },
  { k: 'zh', label: '簡體歌詞轉繁體', opts: [['auto', '自動轉換'], ['off', '保持原文']] },
  { k: 'trans', label: '翻譯行', opts: [[true, '顯示'], [false, '隱藏']] },
  { k: 'quality', label: '畫面效果', opts: [['auto', '自動'], ['high', '華麗'], ['eco', '流暢']] },
];
function openSettings() {
  const b = el('div'); b.append(el('h2', null, '設定'));
  for (const s of SETTINGS) {
    const row = el('div', 'opt'), seg = el('div', 'seg');
    row.append(el('label', null, s.label));
    for (const [v, txt] of s.opts) {
      const btn = el('button', null, txt); btn.setAttribute('aria-pressed', String(prefs[s.k] === v));
      btn.onclick = () => {
        prefs[s.k] = v; if (s.k === 'quality') autoEco = false;
        savePrefs(); [...seg.children].forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
        if (s.k === 'zh') represent();
      };
      seg.append(btn);
    }
    row.append(seg); b.append(row);
  }
  const off = el('div', 'opt'), offRow = el('div', 'row'), out = el('span', 'btn quiet');
  const upd = () => { out.textContent = (prefs.offset >= 0 ? '+' : '−') + Math.abs(prefs.offset / 1000).toFixed(1) + ' 秒'; };
  const mk = (txt, dv) => { const x = el('button', 'btn', txt); x.onclick = () => { prefs.offset = dv === 0 ? 0 : clamp(prefs.offset + dv, -5000, 5000); store.set('prefs', prefs); upd(); updateOffsetLabel(); }; return x; };
  upd(); offRow.append(mk('延後', -200), out, mk('提前', 200), mk('歸零', 0));
  off.append(el('label', null, '歌詞時間微調'), offRow); b.append(off);
  const acc = el('div', 'opt'), accRow = el('div', 'row');
  acc.append(el('label', null, 'Spotify'));
  if (auth && !demo.active) { const x = el('button', 'btn', '登出'); x.onclick = () => { closeSheet(); logout('已登出'); }; accRow.append(x); }
  else { const x = el('button', 'btn spotify', '連接 Spotify'); x.onclick = () => { closeSheet(); if (FRAMED) openGuide(false); else { demo.stop(); showSetup(); } }; accRow.append(x); }
  const g = el('button', 'btn', '設定說明'); g.onclick = () => openGuide(false); accRow.append(g);
  acc.append(accRow); b.append(acc);
  b.append(el('p', 'about', '歌詞來自 LRCLIB 社群資料庫；同步時間由社群提供，個別歌曲可能略有誤差，可用「歌詞時間微調」校正。點任一句歌詞可以跳到那個位置。'));
  openSheet(b);
}
function openSheet(node) { $('#sheetBody').replaceChildren(node); app.classList.add('sheet-open'); $('#sheet').scrollTop = 0; }
function closeSheet() { app.classList.remove('sheet-open'); }

/* ════════════════ 示範模式（原創示範歌曲） ════════════════ */

const demo = {
  active: false,
  start() {
    this.active = true; clearTimeout(pollTimer);
    $('#badge').hidden = false; app.classList.add('demo-on');
    $('#badgeBtn').textContent = FRAMED ? '部署說明' : '連接 Spotify';
    pb.reset();
    applyPlayback({ item: { id: DEMO_ID, name: '流光 Lumen', artists: [{ name: 'Lumen 示範' }], album: { name: 'Night Drive', images: [] }, duration_ms: 80000 }, is_playing: true, progress_ms: 0, currently_playing_type: 'track' }, 0, performance.now());
    enterPlayer();
  },
  stop() { if (!this.active) return; this.active = false; $('#badge').hidden = true; app.classList.remove('demo-on'); pb.reset(); LV.state('idle'); },
  tick(now) { if (pb.playing && pos(now) >= pb.duration - 5) { pb.progress = 0; pb.at = now; } },
  ctrl(a) {
    if (a === 'toggle') { pb.progress = pos(); pb.at = performance.now(); pb.playing = !pb.playing; onPlayState(); }
    else if (a === 'next' || a === 'prev') seekTo(0);
  },
};

/* ════════════════ 視圖切換 ════════════════ */
function showSetup() { app.dataset.view = 'setup'; pairing.start(); }
function enterPlayer() {
  pairing.stop(); app.dataset.view = 'player';
  if (!pb.item && !demo.active) LV.state('connecting');
  requestAnimationFrame(() => LV.relayout(true));
  if (!demo.active) schedulePoll(0);
}
let clockTimer = 0;
function tickClock() {
  clearInterval(clockTimer);
  const f = () => {
    if (app.dataset.ly !== 'idle') return clearInterval(clockTimer);
    const d = new Date();
    $('#clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    $('#date').textContent = d.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'long' });
  };
  f(); clockTimer = setInterval(f, 1000);
}

/* ════════════════ 主迴圈 ════════════════ */
const fpsMon = {
  n: 0, acc: 0, bad: 0, last: 0,
  tick(now) {
    if (this.last) { const dt = now - this.last; if (dt < 250) { this.acc += dt; this.n++; } }
    this.last = now;
    if (this.n < 90) return;
    const avg = this.acc / this.n; this.n = this.acc = 0;
    this.bad = avg > 27 ? this.bad + 1 : Math.max(0, this.bad - 1);
    if (this.bad >= 2 && prefs.quality === 'auto' && !autoEco) { autoEco = true; updateQuality(); toast('已自動切換為「流暢」畫面效果'); }
  },
};
let lastSec = -1;
function loop(now) {
  requestAnimationFrame(loop);
  aurora.draw(now);
  if (app.dataset.view !== 'player') { fpsMon.last = 0; return; }
  fpsMon.tick(now);
  if (demo.active) demo.tick(now);
  const p = pos(now);
  LV.update(p + prefs.offset);
  const d = pb.duration;
  $('#bar').style.transform = `scaleX(${d ? clamp(p / d, 0, 1).toFixed(4) : 0})`;
  const s = Math.floor(p / 1000);
  if (s !== lastSec) { lastSec = s; $('#tCur').textContent = fmt(p); $('#tDur').textContent = fmt(d); }
}

/* ════════════════ 事件 ════════════════ */
function bind() {
  $('#btnDemo').onclick = () => demo.start();
  $('#btnDirect').onclick = () => openGuide(true);
  $('#btnGuide').onclick = () => openGuide(false);
  $('#badgeBtn').onclick = () => { if (FRAMED) openGuide(false); else { demo.stop(); showSetup(); } };
  $('#sheetBack').onclick = closeSheet; $('#sheetX').onclick = closeSheet;
  $('#hud').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation(); act(b.dataset.act); showHud(true); });
  $('#player').addEventListener('click', e => {
    const line = e.target.closest('.line');
    if (line && LV.mode === 'synced' && !line.classList.contains('credit')) {
      const it = LV.items[+line.dataset.i];
      if (it) { seekTo(Math.max(0, it.t - prefs.offset - 250)); line.classList.remove('tap'); void line.offsetWidth; line.classList.add('tap'); }
      return;
    }
    showHud(!$('#hud').classList.contains('show'));
  });
  addEventListener('keydown', e => {
    if (app.dataset.view !== 'player' || e.target.tagName === 'INPUT') return;
    if (e.key === ' ') { e.preventDefault(); act('toggle'); }
    else if (e.key === 'ArrowRight') act('next'); else if (e.key === 'ArrowLeft') act('prev');
    else if (e.key === 'ArrowUp') act('off+'); else if (e.key === 'ArrowDown') act('off-');
    else if (e.key === 'Escape') closeSheet();
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && auth && !demo.active && app.dataset.view === 'player') schedulePoll(0); });
  let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => LV.relayout(true), 150); });
  document.fonts?.addEventListener?.('loadingdone', () => LV.relayout(true));
  document.fonts?.ready?.then(() => LV.relayout(true));
  matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => { if (prefs.theme === 'auto') aurora.themeChanged(); });
}

/* ════════════════ 啟動 ════════════════ */
async function boot() {
  bind(); applyPrefs(); requestAnimationFrame(loop);
  const cb = await handleCallback();
  if (cb) {
    if (cb.mode === 'pair') {
      if (cb.error || !cb.pair) { phoneView('error', { msg: cb.error || '配對資訊遺失，請回到車上重新掃描', pair: cb.pair }); return; }
      try { await sendToCar(cb.pair, cb.cid, cb.tokens); } catch (e) { phoneView('error', { msg: '傳送到車上失敗：' + e.message, pair: cb.pair }); }
      return;
    }
    if (cb.error) toast(cb.error, 5000);
    else { saveTokens(cb.cid, cb.tokens); enterPlayer(); return; }
  }
  const hp = location.hash.match(/^#p=([\w-]{8,40})\.([\w-]{40,50})$/);
  if (hp) { const pair = { id: hp[1], key: hp[2] }; history.replaceState(null, '', REDIRECT_URI); phoneView('form', { pair }); return; }
  if (location.hash === '#demo' || FRAMED) { demo.start(); return; }
  if (auth?.rt) { enterPlayer(); return; }
  showSetup();
}
window.Lumen = { pb, LV, demo, prefs, pairing, seekTo, parseLRC, buildModel, tokenize, cleanTitle, scoreRec, looksSimplified };
boot();
